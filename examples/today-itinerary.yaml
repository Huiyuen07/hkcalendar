# 把今日行程寫入 input_text.calendar，讓卡片滾動顯示。
# Writes today's events to input_text.calendar for the card's scrolling line.
#
# 需要 / requires: 一個 input_text.calendar helper，並把 calendar.your_calendar 換成你的日曆。
# Create an input_text.calendar helper and replace calendar.your_calendar with your calendar.
#
# script.yaml:

today_s_itinerary:
  alias: Today itinerary
  sequence:
    - action: calendar.get_events
      target:
        entity_id: calendar.your_calendar
      data:
        start_date_time: "{{ now().replace(hour=0, minute=0, second=0).isoformat() }}"
        end_date_time: "{{ now().replace(hour=23, minute=59, second=59).isoformat() }}"
      response_variable: calendar_events
    - action: input_text.set_value
      target:
        entity_id: input_text.calendar
      data:
        value: >-
          {% set ns = namespace(summary=[]) %}
          {% set events = calendar_events['calendar.your_calendar']['events'] | default([]) %}
          {% for event in events %}
            {% if event.start|length == 10 %}
              {% set ns.summary = ns.summary + [event.summary] %}
            {% else %}
              {% set time = as_timestamp(event.start) | timestamp_custom('%I:%M %p', True) %}
              {% set ns.summary = ns.summary + [time ~ ' ' ~ event.summary] %}
            {% endif %}
          {% endfor %}
          {{ ns.summary | join('  |  ') if ns.summary else '無日程' }}

# automations.yaml（每 5 分鐘更新 / refresh every 5 minutes）:
